[package]
name = "gbcformer"
version = "0.1.0"
edition = "2024"
description = "The Game Boy Color compiled into one Llama checkpoint: CPU, memory, graphics, sound and control logic, every weight written by a compiler"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iammatthias/GBCformer"
readme = "README.md"

[features]
default = ["frontend", "gbc"]
# The Game Boy: circuits, reference devices, the host machine, sessions. Without it the
# crate is the inference core alone (the minimal runner's dependency).
gbc = []
# Engines with a view record their passes (`GBCFORMER_RECORD`) or hand them to another
# runtime (`src/engine/stock.rs`), without the Game Boy: the minimal runner records too.
record = []
# Test-only: `record` with the Game Boy.
stock = ["gbc", "record"]
# Test-only: the engine's fault hooks (`Engine::dense_mut`, `Engine::inject_fault`), which
# break the fast plan's contract on purpose (`tests/step_oracle_faults.rs`).
testing = []
# The desktop player: a window, speaker output and frame pacing.
frontend = ["gbc", "dep:minifb", "dep:cpal"]

[dependencies]
minifb = { version = "0.29.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.18.2", optional = true }

[profile.release]
debug = "line-tables-only"
# About 1% fewer CPU-thread instructions per step (docs/perf-log.md, "Build settings").
lto = "thin"
codegen-units = 1

[[bin]]
name = "gbcformer"
required-features = ["frontend"]

[[test]]
name = "step_oracle_faults"
required-features = ["testing"]
